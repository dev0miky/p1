name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-test:
    name: engine test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: build
        working-directory: engine
        run: go build ./...
      - name: vet
        working-directory: engine
        run: go vet ./...
      - name: test
        working-directory: engine
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:55432/test?sslmode=disable
        run: go test -count=1 -p 1 -race -coverprofile=coverage.out ./...
      - name: coverage summary
        working-directory: engine
        run: go tool cover -func=coverage.out | tail -1

  engine-lint:
    name: engine lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: engine
          args: --timeout=5m

  console-build:
    name: console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: install
        working-directory: apps/console
        run: npm install --no-audit --no-fund
      - name: build
        working-directory: apps/console
        run: npm run build

  agent-build:
    name: agent build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - name: install
        working-directory: apps/agent
        run: npm install --no-audit --no-fund
      - name: build
        working-directory: apps/agent
        run: npm run build

  compose-validate:
    name: compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: copy env
        run: cp .env.example .env
      - name: validate dev
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: validate prod
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [engine-test, console-build, agent-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build engine image
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          push: false
          tags: p1-engine-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY=api
      - name: build console image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/console
          push: false
          tags: p1-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build agent image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/agent
          push: false
          tags: p1-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
