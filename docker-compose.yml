name: p1

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  prometheusdata:
  grafanadata:
  lokidata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET_RECORDINGS} || true;
      mc anonymous set none local/$${MINIO_BUCKET_RECORDINGS};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RECORDINGS: ${MINIO_BUCKET_RECORDINGS}
    networks: [app]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      P1_DOMAIN: ${P1_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app]

  kamailio:
    build:
      context: ./deploy/kamailio
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ./deploy/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./deploy/kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro

  freeswitch:
    build:
      context: ./deploy/freeswitch
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 999999
        hard: 999999
      core: -1
    volumes:
      - ./deploy/freeswitch/vars.xml:/etc/freeswitch/vars.xml:ro
      - ./deploy/freeswitch/autoload_configs:/etc/freeswitch/autoload_configs:ro
      - ./deploy/freeswitch/sip_profiles:/etc/freeswitch/sip_profiles:ro
      - ./deploy/freeswitch/dialplan:/etc/freeswitch/dialplan:ro
      - ./deploy/freeswitch/scripts:/usr/share/freeswitch/scripts:ro

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks: [app]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    networks: [app]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [app]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on: [postgres]
    networks: [app]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on: [redis]
    networks: [app]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks: [app]

  engine-api:
    build:
      context: ./engine
      args:
        BINARY: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      APP_DATABASE_USER: ${APP_DATABASE_USER:-app_user}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-app_user_change_me}
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      FREESWITCH_ESL_HOST: host.docker.internal
      FREESWITCH_ESL_PORT: ${FREESWITCH_ESL_PORT}
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RECORDINGS: ${MINIO_BUCKET_RECORDINGS}
      LOG_LEVEL: ${LOG_LEVEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app]

  engine-dialer:
    build:
      context: ./engine
      args:
        BINARY: dialer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      APP_DATABASE_USER: ${APP_DATABASE_USER:-app_user}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-app_user_change_me}
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES}
      FREESWITCH_ESL_HOST: host.docker.internal
      FREESWITCH_ESL_PORT: ${FREESWITCH_ESL_PORT}
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD}
      DIALER_GATEWAY: ${DIALER_GATEWAY:-loopback}
      LOG_LEVEL: ${LOG_LEVEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app]

  engine-cdr-ingest:
    build:
      context: ./engine
      args:
        BINARY: cdr-ingest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [app]

  engine-recording-uploader:
    build:
      context: ./engine
      args:
        BINARY: recording-uploader
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RECORDINGS: ${MINIO_BUCKET_RECORDINGS}
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [app]

  engine-dnc-sync:
    build:
      context: ./engine
      args:
        BINARY: dnc-sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: ${LOG_LEVEL}
    networks: [app]

  console:
    build:
      context: ./apps/console
    restart: unless-stopped
    networks: [app]

  agent:
    build:
      context: ./apps/agent
    restart: unless-stopped
    networks: [app]
