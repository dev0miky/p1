name: p1

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET_RECORDINGS} || true;
      mc anonymous set none local/$${MINIO_BUCKET_RECORDINGS};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RECORDINGS: ${MINIO_BUCKET_RECORDINGS}
    networks: [app]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      P1_DOMAIN: ${P1_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app]

  kamailio:
    build:
      context: ./deploy/kamailio
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ./deploy/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./deploy/kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro

  freeswitch:
    build:
      context: ./deploy/freeswitch
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 999999
        hard: 999999
      core: -1
    volumes:
      - ./deploy/freeswitch/vars.xml:/etc/freeswitch/vars.xml:ro
      - ./deploy/freeswitch/autoload_configs:/etc/freeswitch/autoload_configs:ro
      - ./deploy/freeswitch/sip_profiles:/etc/freeswitch/sip_profiles:ro
      - ./deploy/freeswitch/dialplan:/etc/freeswitch/dialplan:ro
      - ./deploy/freeswitch/scripts:/usr/share/freeswitch/scripts:ro

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
